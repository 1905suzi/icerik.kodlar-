<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div class="palette-container" id="paletteContainer">
        <!-- JS ile 20 adet renk sütunu dinamik eklenecek -->
    </div>

    <!-- Alt Kısım Bilgi Kutusu -->
    <div class="info-panel">
        <p>Press <strong>Spacebar</strong> to generate colors | Use <strong>Left/Right Arrows</strong> to scroll</p>
        <button id="generateBtn" class="mobile-gen-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
    </div>

    <!-- Kopyalandı Bildirimi (Toast) -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check"></i> Color copied to clipboard!
    </div>

    <script src="script.js"></script>
</body>
</html>
