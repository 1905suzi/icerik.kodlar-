<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Interactive Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="scene" id="scene">
        
        <!-- Yerde duran çanta -->
        <div class="floor-briefcase" id="floorBriefcase">
            <div class="handle"></div>
            <div class="case"></div>
        </div>

        <!-- Animasyonlu GIF Karakterimiz -->
        <img src="https://media.giphy.com/media/3o7ZetIsjtbkgNE1I4/giphy.gif" class="character" id="character" alt="Karakter">

        <!-- Gizli Giriş Formu -->
        <div class="login-wrapper" id="loginWrapper">
            <div class="login-card">
                <h2>Register now</h2>
                <p>Secure your spot in our upcoming live webinar</p>
                
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Surname" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder="Email address" required>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">Next</button>
                    
                    <div class="social-login">
                        <button type="button" class="google-btn"><i class="fa-brands fa-google"></i></button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
