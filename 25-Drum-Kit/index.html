<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit / Ses Çalar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <h1><i class="fa-solid fa-drum"></i> Drum Kit</h1>
        <p class="subtitle">Klavyeye bas veya kutulara tıkla!</p>
        <div class="keys-container">
            <div class="key" data-key="a" data-sound="kick">
                <span class="letter">A</span>
                <span class="sound-name">Kick</span>
            </div>
            <div class="key" data-key="s" data-sound="snare">
                <span class="letter">S</span>
                <span class="sound-name">Snare</span>
            </div>
            <div class="key" data-key="d" data-sound="hihat">
                <span class="letter">D</span>
                <span class="sound-name">Hi-Hat</span>
            </div>
            <div class="key" data-key="f" data-sound="tom1">
                <span class="letter">F</span>
                <span class="sound-name">Tom 1</span>
            </div>
            <div class="key" data-key="g" data-sound="tom2">
                <span class="letter">G</span>
                <span class="sound-name">Tom 2</span>
            </div>
            <div class="key" data-key="h" data-sound="crash">
                <span class="letter">H</span>
                <span class="sound-name">Crash</span>
            </div>
            <div class="key" data-key="j" data-sound="ride">
                <span class="letter">J</span>
                <span class="sound-name">Ride</span>
            </div>
            <div class="key" data-key="k" data-sound="clap">
                <span class="letter">K</span>
                <span class="sound-name">Clap</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
