<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafıza (Kart Eşleştirme) Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🧠 Hafıza Oyunu</h1>
        <div class="stats">
            <p>Hamle: <span id="moves">0</span></p>
            <p>Eşleşme: <span id="matches">0</span> / 8</p>
        </div>
        <button id="restartBtn">Yeniden Başla</button>
        <div class="board" id="board">
            <!-- Kartlar JS ile üretilecek -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
