<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Sipariş Ekranı - Akıllı Kafe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- Açılış Ekranı (Splash Screen) -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <i class="fa-solid fa-mug-hot splash-icon"></i>
            <h1 class="splash-title">SUZİSWEB</h1>
            <p class="splash-subtitle">Kahvenin en lezzetli hali...</p>
            <button id="enterMenuBtn" class="cat-btn splash-btn">Menüyü Gör</button>
        </div>
    </div>
    
    

    <header>
        <div class="logo">
            <i class="fa-solid fa-mug-hot"></i>
            <h1>SUZİSWEB</h1>
            <p style="font-size: 0.9rem; color: var(--primary);">Masa No: <span id="tableNo"></span></p>
        </div>
    </header>

    <div id="activeOrderContainer"></div>

    <div class="categories" id="categoryContainer">
        <!-- Kategoriler JS ile gelecek -->
    </div>

    <div class="menu-grid" id="menuGrid">
        <!-- Ürünler JS ile gelecek -->
    </div>

    <div class="cart-fab" id="cartFab">
        <i class="fa-solid fa-basket-shopping"></i>
        <div class="cart-count" id="cartCount">0</div>
    </div>

    <!-- Sepet Modalı -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal">
            <i class="fa-solid fa-xmark close-modal" id="closeModal"></i>
            <div class="cart-header"><button class="back-btn" id="backToMenuBtn"><i class="fa-solid fa-arrow-left"></i></button> <h2>Sepetiniz</h2></div>
            <div id="cartItemsContainer"></div>
            <div class="cart-total">Toplam: <span id="cartTotal">0</span> ₺</div>
            <button class="checkout-btn" id="checkoutBtn">Siparişi Onayla</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="customer.js"></script>
    <div id="toast" class="toast">Sepete eklendi! 🛒</div>
</body>
</html>
