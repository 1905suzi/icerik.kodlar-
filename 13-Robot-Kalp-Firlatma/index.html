<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalp Fırlatma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Şirin Çizim Karakter -->
    <div class="karakter">
        <!-- Gövde (yuvarlak blob) -->
        <div class="govde">
            <!-- Yüz -->
            <div class="goz sol-goz"></div>
            <div class="goz sag-goz"></div>
            <div class="agiz"></div>
            <!-- Yanaklar -->
            <div class="yanak sol-yanak"></div>
            <div class="yanak sag-yanak"></div>
        </div>
        <!-- Sol kol (aşağıda) -->
        <div class="kol sol-kol"></div>
        <!-- Sağ kol (fırlatan el) -->
        <div class="kol sag-kol">
            <div class="eldeki-kalp">💕</div>
        </div>
        <!-- Ayaklar -->
        <div class="ayak sol-ayak"></div>
        <div class="ayak sag-ayak"></div>
        <!-- "biu!" yazısı -->
        <div class="biu-yazi">biu!</div>
    </div>

    <!-- Büyük kalp şekli -->
    <div class="kalp-alani" id="kalpAlani"></div>

    <!-- Uçuşan kalpler -->
    <div id="ucusanKalpler"></div>

    <script src="script.js"></script>
</body>
</html>
